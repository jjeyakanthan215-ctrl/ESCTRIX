services:
  - type: web
    name: esctrix
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --workers 1 --ws websockets
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DB_PATH
        value: "users.db"
      - key: RENDER
        value: "true"
      - key: ADMIN_USERS
        value: "ESCTRIX_Admin"
      # Optional: Add GEMINI_API_KEY to upgrade Aura AI to live Google Gemini 1.5 Flash
      # - key: GEMINI_API_KEY
      #   sync: false
      # Optional: Add Firebase Cloud Firestore for multi-region persistent storage on Render
      # - key: FIREBASE_PROJECT_ID
      #   sync: false
      # - key: FIREBASE_API_KEY
      #   sync: false
