{% extends "admin/base.html" %}
{% load static %}

{% block extrastyle %}
<style>
/* ESCTRIX Admin Dark Theme */
:root {
    --accent: #7c3aed;
}

body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #08090b;
    color: #e0e0e0;
}

/* Main header bar */
#header {
    background: linear-gradient(135deg, #0f1012 0%, #1a0b2e 100%);
    border-bottom: 1px solid rgba(124, 58, 237, 0.4);
    padding: 10px 20px;
}

#header a:link, #header a:visited {
    color: #a78bfa;
}

#branding h1 {
    font-size: 1.2rem;
    font-weight: 700;
    color: #fff;
}

#branding h1 a:link, #branding h1 a:visited {
    background: linear-gradient(135deg, #00d2ff, #7c3aed);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

/* Navigation */
div#nav-sidebar {
    background: #0f1012;
    border-right: 1px solid #1f1f2e;
}

/* User tools links */
#user-tools {
    color: #a8a8a8;
}

#user-tools a {
    color: #a78bfa;
}

/* Main content */
#content {
    background: #08090b;
    color: #e0e0e0;
}

/* Breadcrumbs */
div.breadcrumbs {
    background: #0f1012;
    border-bottom: 1px solid #1f1f2e;
    color: #a8a8a8;
}

div.breadcrumbs a {
    color: #a78bfa;
}

/* Page header */
#content h1 {
    color: #ffffff;
}

/* Module boxes */
.module {
    background: #0f1012;
    border: 1px solid #1f1f2e;
    border-radius: 8px;
    overflow: hidden;
}

.module caption, .module h2, .module h3 {
    background: linear-gradient(135deg, #1a0b2e, #0f1012);
    color: #a78bfa;
    border-bottom: 1px solid rgba(124, 58, 237, 0.3);
    padding: 10px 15px;
    font-size: 0.85rem;
    letter-spacing: 0.5px;
    text-transform: uppercase;
}

/* Table rows */
#result_list thead th {
    background: #1a0b2e;
    color: #a78bfa;
    border-bottom: 1px solid rgba(124, 58, 237, 0.3);
}

#result_list tbody tr {
    background: #0f1012;
    border-bottom: 1px solid #1f1f2e;
}

#result_list tbody tr:hover {
    background: #1a1b2e;
}

#result_list tbody td, #result_list tbody th {
    color: #e0e0e0;
}

#result_list tbody tr.selected {
    background: rgba(124, 58, 237, 0.15);
}

/* Links */
a:link, a:visited {
    color: #a78bfa;
}

a:hover {
    color: #c4b5fd;
}

/* Buttons */
.button, input[type=submit], input[type=button], .submit-row input {
    background: #7c3aed;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 8px 18px;
    font-weight: 600;
    transition: background 0.2s;
    cursor: pointer;
}

.button:hover, input[type=submit]:hover, input[type=button]:hover {
    background: #6d28d9;
}

.button.default, input[type=submit].default {
    background: linear-gradient(135deg, #00d2ff, #7c3aed);
}

/* Delete button */
.deletelink, .button.danger, input[type=submit].danger {
    background: #b91c1c;
}

.deletelink:hover {
    background: #991b1b;
}

/* Form inputs */
input[type=text], input[type=password], input[type=email],
input[type=url], input[type=number], input[type=date],
select, textarea {
    background: #1a1b1f;
    border: 1px solid #2d2d3f;
    color: #e0e0e0;
    border-radius: 5px;
    padding: 8px 10px;
}

input[type=text]:focus, input[type=password]:focus,
input[type=email]:focus, input[type=url]:focus,
select:focus, textarea:focus {
    border-color: #7c3aed;
    outline: none;
    box-shadow: 0 0 0 2px rgba(124, 58, 237, 0.2);
}

/* Sidebar navigation module */
.module ul li a {
    color: #a78bfa;
    padding: 6px 15px;
    display: block;
    transition: background 0.15s;
}

.module ul li a:hover {
    background: rgba(124, 58, 237, 0.1);
    color: #c4b5fd;
}

/* Action bar */
.actions {
    background: #0f1012;
    border: 1px solid #1f1f2e;
    border-radius: 6px;
    padding: 10px;
}

.actions select {
    max-width: 250px;
    margin-right: 10px;
}

/* Footer */
#footer {
    background: #0f1012;
    border-top: 1px solid #1f1f2e;
    color: #555;
    text-align: center;
    padding: 10px;
    font-size: 0.75rem;
}

/* Paginator */
.paginator {
    background: #0f1012;
    border-top: 1px solid #1f1f2e;
    color: #a8a8a8;
}

.paginator a {
    color: #a78bfa;
}

/* Search bar */
#searchbar {
    background: #1a1b1f;
    border: 1px solid #2d2d3f;
    color: #e0e0e0;
    border-radius: 5px;
    padding: 6px 12px;
}

/* Filter sidebar */
#changelist-filter {
    background: #0f1012;
    border-left: 1px solid #1f1f2e;
}

#changelist-filter h2 {
    background: #1a0b2e;
    color: #a78bfa;
}

#changelist-filter h3 {
    color: #a8a8a8;
    border-bottom: 1px solid #1f1f2e;
}

#changelist-filter li a {
    color: #a78bfa;
}

#changelist-filter li.selected a {
    color: #fff;
    font-weight: 600;
}

/* Messages */
ul.messagelist li {
    background: rgba(124, 58, 237, 0.15);
    border-left: 4px solid #7c3aed;
    color: #e0e0e0;
}

ul.messagelist li.success {
    background: rgba(76, 217, 100, 0.15);
    border-left-color: #4cd964;
}

ul.messagelist li.error {
    background: rgba(237, 73, 86, 0.15);
    border-left-color: #ed4956;
}

ul.messagelist li.warning {
    background: rgba(251, 191, 36, 0.15);
    border-left-color: #fbbf24;
}

/* Help text */
.help {
    color: #888;
    font-size: 0.8rem;
}

/* Inline admin */
.inline-group {
    background: #0f1012;
    border: 1px solid #1f1f2e;
    border-radius: 8px;
}

.inline-group h2 {
    background: #1a0b2e;
    color: #a78bfa;
}

/* Status check marks */
img.action-icon {
    filter: invert(1);
}

/* Boolean fields - yes/no */
.yes-icon, td.nowrap img[src*="icon-yes"] {
    filter: hue-rotate(120deg) brightness(1.2);
}

/* Login page specific */
body.login {
    background: radial-gradient(circle at 0% 0%, rgba(124, 58, 237, 0.15), transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(0, 210, 255, 0.1), transparent 40%),
                #08090b;
    background-image: linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
    background-size: 40px 40px, 40px 40px, cover;
}

body.login #header {
    display: none;
}

body.login #content-main {
    margin: 0 auto;
}

body.login .login #content-main {
    background: rgba(15, 16, 18, 0.8);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
}

#login-form input {
    background: #1a1b1f;
    border: 1px solid #2d2d3f;
    color: #e0e0e0;
    border-radius: 5px;
}

#login-form input[type=submit] {
    background: linear-gradient(135deg, #7c3aed, #00d2ff);
    width: 100%;
    padding: 12px;
    font-size: 1rem;
    margin-top: 10px;
}
</style>
{% endblock %}
