{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block page_title %}ESCTRIX Legal{% endblock %}</title>
    <link rel="icon" type="image/png" href="{% static 'img/favicon.png' %}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *, *::before, *::after {
            box-sizing: border-box; margin: 0; padding: 0;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        *::-webkit-scrollbar { display: none; }
        body {
            font-family: 'Inter', sans-serif;
            background: #09090f;
            color: #d4d4d8;
            min-height: 100vh;
        }
        /* Top nav bar */
        .legal-nav {
            position: sticky; top: 0; z-index: 100;
            background: rgba(9,9,15,0.92);
            backdrop-filter: blur(18px);
            border-bottom: 1px solid rgba(255,255,255,0.07);
            padding: 14px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .legal-nav-logo {
            display: flex; align-items: center; gap: 10px;
            text-decoration: none;
        }
        .legal-nav-logo img { height: 32px; }
        .legal-nav-logo span {
            font-size: 1.2rem; font-weight: 800; letter-spacing: 2px;
            background: linear-gradient(135deg, #00d2ff, #7c3aed);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .legal-nav-back {
            font-size: 0.82rem; color: #a78bfa; text-decoration: none;
            display: flex; align-items: center; gap: 6px; font-weight: 500;
        }
        .legal-nav-back:hover { color: #c4b5fd; }

        /* Page wrapper */
        .legal-wrapper {
            max-width: 820px;
            margin: 0 auto;
            padding: 60px 30px 100px;
        }

        /* Breadcrumb pills */
        .legal-tabs {
            display: flex; gap: 10px; flex-wrap: wrap;
            margin-bottom: 40px;
        }
        .legal-tab {
            padding: 7px 18px;
            border-radius: 50px;
            font-size: 0.8rem; font-weight: 600;
            text-decoration: none;
            border: 1px solid rgba(255,255,255,0.12);
            color: rgba(255,255,255,0.45);
            transition: all 0.2s;
        }
        .legal-tab:hover { color: #a78bfa; border-color: rgba(124,58,237,0.4); }
        .legal-tab.active {
            background: rgba(124,58,237,0.15);
            border-color: rgba(124,58,237,0.5);
            color: #a78bfa;
        }

        /* Page header */
        .legal-header {
            margin-bottom: 40px;
        }
        .legal-badge {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(124,58,237,0.12);
            border: 1px solid rgba(124,58,237,0.3);
            border-radius: 50px;
            padding: 5px 14px;
            font-size: 0.72rem; font-weight: 700; letter-spacing: 0.5px;
            color: #a78bfa;
            text-transform: uppercase;
            margin-bottom: 16px;
        }
        .legal-title {
            font-size: 2.2rem; font-weight: 800; color: #fff;
            line-height: 1.2; margin-bottom: 10px;
        }
        .legal-subtitle {
            font-size: 0.9rem; color: rgba(255,255,255,0.4);
            line-height: 1.6;
        }
        .legal-updated {
            font-size: 0.75rem; color: rgba(255,255,255,0.25);
            margin-top: 8px;
        }

        /* Section */
        .legal-section {
            margin-bottom: 40px;
        }
        .legal-section h2 {
            font-size: 1.1rem; font-weight: 700; color: #e4e4e7;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.07);
            display: flex; align-items: center; gap: 10px;
        }
        .legal-section h2 i {
            color: #a78bfa; font-size: 0.95rem;
        }
        .legal-section p {
            font-size: 0.875rem; line-height: 1.75;
            color: rgba(255,255,255,0.55);
            margin-bottom: 10px;
        }
        .legal-section ul {
            list-style: none; padding: 0;
            display: flex; flex-direction: column; gap: 8px;
        }
        .legal-section ul li {
            display: flex; align-items: flex-start; gap: 10px;
            font-size: 0.875rem; color: rgba(255,255,255,0.55); line-height: 1.6;
        }
        .legal-section ul li::before {
            content: '›';
            color: #7c3aed; font-size: 1.1rem;
            flex-shrink: 0; margin-top: 1px;
        }

        /* Alert boxes */
        .legal-alert {
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
            font-size: 0.82rem;
            line-height: 1.6;
        }
        .legal-alert.warning {
            background: rgba(251,191,36,0.08);
            border: 1px solid rgba(251,191,36,0.25);
            color: #fde68a;
        }
        .legal-alert.info {
            background: rgba(124,58,237,0.1);
            border: 1px solid rgba(124,58,237,0.25);
            color: #c4b5fd;
        }
        .legal-alert.danger {
            background: rgba(239,68,68,0.08);
            border: 1px solid rgba(239,68,68,0.2);
            color: #fca5a5;
        }
        .legal-alert i { font-size: 1rem; margin-top: 1px; flex-shrink: 0; }

        /* Footer */
        .legal-footer {
            margin-top: 60px;
            padding-top: 24px;
            border-top: 1px solid rgba(255,255,255,0.07);
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 12px;
        }
        .legal-footer-links { display: flex; gap: 20px; flex-wrap: wrap; }
        .legal-footer-links a { font-size: 0.78rem; color: rgba(255,255,255,0.28); text-decoration: none; }
        .legal-footer-links a:hover { color: #a78bfa; }
        .legal-footer-copy { font-size: 0.75rem; color: rgba(255,255,255,0.2); }
    </style>
</head>
<body>
    <nav class="legal-nav">
        <a href="/auth/" class="legal-nav-logo">
            <img src="{% static 'img/logo.png' %}" alt="ESCTRIX">
            <span>ESCTRIX</span>
        </a>
        <a href="/auth/" class="legal-nav-back">
            <i class="fa-solid fa-arrow-left"></i> Back to Login
        </a>
    </nav>

    <div class="legal-wrapper">
        <div class="legal-tabs">
            <a href="/privacy/" class="legal-tab {% if request.resolver_match.url_name == 'privacy' %}active{% endif %}">
                <i class="fa-solid fa-shield-halved"></i> Privacy Policy
            </a>
            <a href="/terms/" class="legal-tab {% if request.resolver_match.url_name == 'terms' %}active{% endif %}">
                <i class="fa-solid fa-file-contract"></i> Terms & Conditions
            </a>
            <a href="/security/" class="legal-tab {% if request.resolver_match.url_name == 'security' %}active{% endif %}">
                <i class="fa-solid fa-lock"></i> Security Features
            </a>
        </div>

        {% block content %}{% endblock %}

        <div class="legal-footer">
            <div class="legal-footer-links">
                <a href="/privacy/">Privacy Policy</a>
                <a href="/terms/">Terms & Conditions</a>
                <a href="/security/">Security</a>
                <a href="/auth/">Login</a>
            </div>
            <div class="legal-footer-copy">© 2026 ESCTRIX · All rights reserved</div>
        </div>
    </div>
</body>
</html>
